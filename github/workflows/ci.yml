name: CI
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: make deps

    - name: Lint
      run: make lint

    - name: Test
      run: make test

    - name: Build
      run: make build
