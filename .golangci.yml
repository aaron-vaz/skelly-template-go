version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
    - usestdlibvars
  exclusions:
    rules:
      # Tests run the compiled binary and listen on throwaway ports
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/{{.Inputs.owner.Value}}/{{.Inputs.project_name.Value}}
